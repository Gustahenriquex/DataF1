name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: f1i
          POSTGRES_USER: f1i
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f1i -d f1i"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      F1I_ENV: test
      F1I_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest --cov=f1i --cov-report=term-missing

      - name: Integration tests (PostgreSQL)
        run: uv run pytest -m integration
