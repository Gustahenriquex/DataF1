# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-env-files
        name: block committed .env files
        entry: .env files must not be committed (use .env.example)
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '\.env\.example$'
